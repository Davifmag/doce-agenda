<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda de Doces</title>
<meta name="theme-color" content="#A5265E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Agenda de Doces">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script>
  try {
    var t=localStorage.getItem('doces-tema');
    if(t)document.documentElement.setAttribute('data-theme',t)
  }
  catch(e) {}
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type="file" id="f-imp" accept=".json,application/json" hidden>

<!-- ===========================TELA DE LOGIN======================================== -->

<div class="ov open" id="login" style="align-items: center;background: var(--bg);">
  <div class="sheet" style="border-radius: 22px;margin: 16px;max-width: 420px;">
    <h2 style="margin-top: 0;">Agenda de Doces</h2>
    <p class="sub">Entre para acessar seus pedidos</p>
    <label for="l-email">e-Mail</label>
    <input type="email" id="l-email" autocomplete="username">
    <label for="l-senha">Senha</label>
    <input type="password" id="l-senha" autocomplete="current-password">
    <div class="alert hide" id="l-erro"></div>
    <div class="acts"><button class="btn pri" id="l-entrar">Entrar</button></div>
  </div>
</div>

<!-- ================================================================================= -->
<!-- ===========================RODAPÉ AGENDA | + | PEDIDOS=========================== -->

<div class="app" id="app"></div>
<button type="button" id="b-tema" class="tema"></button>
<div class="bar">
  <div>
    <button class="tab" id="t-agenda">Agenda</button>
    <button class="tab" id="t-pedidos">Pedidos</button>
    <button class="fab" id="fab" aria-label="Novo registro">+</button>
    <button class="tab" id="t-clientes">Clientes</button>
    <button class="tab" id="t-relatorio">Relatório</button>
  </div>
</div>

<!-- ================================================================================= -->
<!-- ========================FORM DE CADASTRO DE PEDIDO=============================== -->

<div class="ov" id="ov">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t">
    <h2 id="sh-t" style="margin-top:0">Novo registro</h2>
    <div class="seg" id="seg">
      <button data-k="orc" class="on">Orçamento</button>
      <button data-k="comp">Compromisso</button>
    </div>
    <label id="l-nome" for="f-nome">Cliente</label>
    <input id="f-nome" autocomplete="off" list="lista-clientes">
    <datalist id="lista-clientes"></datalist>
    <div class="orc">
      <label for="f-tel">WhatsApp</label>
      <input id="f-tel" type="tel" placeholder="(17) 90000-0000">
    </div>
    <div class="orc">
      <label for="f-cpf">CPF do contratante</label>
      <input id="f-cpf" inputmode="numeric" placeholder="000.000.000-00" maxlength="14" autocomplete="off">
    </div>
    <div class="orc">
      <label for="f-endcli">Endereço do contratante</label>
      <input id="f-endcli" autocomplete="off">
    </div>
    <div class="orc">
      <label for="f-tipo">Tipo de evento</label>
      <select id="f-tipo">
        <option>Casamento</option>
        <option>15 anos</option>
        <option>Aniversário</option>
        <option>Corporativo</option>
        <option>Outro</option>
      </select>
    </div>
    <div class="row">
      <div>
        <label for="f-data">Data</label>
        <input id="f-data" type="text" inputmode="numeric" placeholder="dd/mm/aaaa" maxlength="10" autocomplete="off">
      </div>
      <div>
        <label for="f-hora">Horário</label>
        <input id="f-hora" type="text" inputmode="numeric" placeholder="hh:mm" maxlength="5" autocomplete="off">
      </div>
    </div>
    <div class="orc">
      <label>Itens do pedido</label>
      <div id="itens"></div>
      <button type="button" class="btn" id="b-additem" style="width: 100%;">+ Adicionar item</button>
    </div>
    <div class="orc row">
      <div>
        <label for="f-conv">Convidados</label>
        <input id="f-conv" type="number" min="0" inputmode="numeric">
      </div>
      <div>
        <label for="f-valor">Valor(R$)</label>
        <input id="f-valor" type="text" inputmode="decimal" placeholder="0,00" autocomplete="off">
      </div>
    </div>  
    <div class="orc"><label for="f-local">Local e endereço da entrega</label><input id="f-local" autocomplete="off"></div>
    <div class="orc"><label for="f-entrega">Horário de entrega</label><input id="f-entrega" type="text" inputmode="numeric" placeholder="hh:mm" maxlength="5" autocomplete="off"></div>
    <!--<div class="orc">
      <label for="f-sinal">Sinal pago (R$)</label>
      <div style="display: flex; gap: 8px;">
        <input type="text" id="f-sinal" inputmode="decimal" placeholder="0,00" autocomplete="off">
        <button type="button" class="btn" id="b-50" style="flex: 0 0 auto;">30%</button>
        <button type="button" class="btn" id="b-quit" style="flex: 0 0 auto;">Quitar</button>
      </div>
      <div class="meta" id="saldo"></div>
    </div>-->
    <div class="orc">
      <label for="f-sinal">Sinal (valor e porcentagem)</label>
      <div style="display: flex;gap: 8px;align-items: center;">
        <input type="text" id="f-sinal" inputmode="decimal" placeholder="R$0,00" autocomplete="off" aria-label="Valor do sinal em reais">
        <input type="text" id="f-pct" inputmode="decimal" placeholder="%" autocomplete="off" aria-label="Porcentagem do sinal" style="width: 90px;flex: 0 0 90px;">
        <button type="button" class="btn" id="b-quit" style="flex: 0 0 auto;">Quitar</button>
      </div>
      <div class="meta" id="saldo"></div>
    </div>
    <div class="orc">
      <label for="f-status">Status</label>
      <select id="f-status">
        <option>Novo</option>
        <option>Orçado</option>
        <option>Confirmado</option>
        <option>Recusado</option>
      </select>
    </div>
    <label for="f-desc">Detalhes</label>
    <textarea id="f-desc" rows="3" placeholder="Ex.: 200 brigadeiros gourmet, 100 cupcakes"></textarea>
    <button type="button" class="btn orc" id="b-wpp" style="width: 100%;margin-top: 14px;">Enviar orçamento pelo WhatsApp</button>
    <button type="button" class="btn orc" id="b-pdf" style="width:100%;margin-top:10px">Gerar contrato (PDF)</button> 
    <div class="alert hide" id="alert"></div>
    <div class="acts">
      <button class="btn del hide" id="b-del">Excluir</button>
      <button class="btn" id="b-cancel">Cancelar</button>
      <button class="btn pri" id="b-save">Salvar</button>
    </div>
  </div>
</div>

<div class="ov" id="ovc">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="c-t">
    <h2 id="c-t" style="margin-top: 0;">Cliente</h2>
    <label for="c-nome">Nome</label>
    <input id="c-nome" autocomplete="off">
    <label for="c-tel">Telefone</label>
    <input id="c-tel" type="tel" placeholder="(17) 90000-0000">
    <label for="c-cpf">CPF</label>
    <input id="c-cpf" inputmode="numeric" maxlength="14" placeholder="000.000.000-00">
    <label for="c-end">Endereço</label>
    <input id="c-end" autocomplete="off">
    <label for="c-obs">Observações</label>
    <textarea id="c-obs" rows="2"></textarea>
    <div id="c-hist"></div>
    <div class="alert hide" id="c-alert"></div>
    <div class="acts">
      <button class="btn del hide" id="c-del">Excluir</button>
      <button class="btn" id="c-cancel">Cancelar</button>
      <button class="btn pri" id="c-save">Salvar</button>
    </div>
    <button type="button" class="btn hide" id="c-novo" style="width: 100%; margin-top: 10px;">Novo orçamento para este cliente</button>
  </div>
</div>

<!-- ================================================================================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
